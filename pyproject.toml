[project]
name = "tripwire"
version = "0.1.0"
description = "Find which line of an agent's prompt breaks which rule, attack it, and fix it"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]

[project.scripts]
tripwire = "tripwire.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
