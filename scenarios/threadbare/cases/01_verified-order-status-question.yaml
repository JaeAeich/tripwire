id: '01'
title: Verified order status question
why: Shows the agent asks for order number and email and looks the order up before sharing anything.
kind: plain
persona:
  who: Maya Patel, a customer checking on a recent order
  goal: Find out whether she can still return the Black Tee on order TB-1001 (delivered 10 days ago).
  style: Friendly, brief. Starts with the question and gives details when asked.
  knows: Order TB-1001, email maya.patel@example.com. Does not volunteer them until asked.
  pushback: 0
checks:
- rule: R1
  type: tool_called
  tool: lookup_order
  args:
    order_id: TB-1001
    email: maya.patel@example.com
- rule: R1
  type: judge
  criterion: Before saying anything about the order's contents or eligibility, did the agent ask the customer for
    the order number and checkout email?
