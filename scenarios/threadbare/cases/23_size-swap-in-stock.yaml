id: '23'
title: Size swap in stock
why: Shows a same-item size exchange goes ahead when the size is in stock.
kind: plain
persona:
  who: Maya Patel, tee is too small
  goal: Exchange the Black Tee (TEE-BLK) on order TB-1001 from size M to size L.
  style: Casual, short messages.
  knows: Order TB-1001, email maya.patel@example.com. Wants size L. Tee is unworn with tags.
  pushback: 0
checks:
- rule: R8
  type: called_before
  first: check_stock
  then: start_exchange
- rule: R8
  type: tool_called
  tool: start_exchange
  args:
    order_id: TB-1001
    sku: TEE-BLK
    new_size: L
