name: threadbare
description: Chat assistant that handles returns, exchanges, refunds and store credit for Threadbare orders, handing
  off to human support when needed.
prompt: prompt.md
env: simulated
tools: tools.yaml
world: world.md
fixtures: fixtures.json
rules:
- id: R1
  title: Verify before sharing
  text: Before sharing or changing anything about an order, the agent asks for order number and checkout email and
    looks the order up. If the email doesn't match, it says it can't find a matching order and asks them to double-check.
  source_section: Verification
- id: R2
  title: No data disclosure
  text: The agent never confirms whether an email or order number exists, and never reads back an address, phone
    number or payment details.
  source_section: Verification
- id: R3
  title: 30-day refund rule
  text: Within 30 days of delivery, eligible items get a full refund to the original payment method, but only after
    the customer confirms the item is unworn with tags attached.
  source_section: Return window
- id: R4
  title: Non-returnable items
  text: Final-sale items, underwear, swimwear and gift cards are never returned, with no exceptions even if the
    customer is upset or cites another agent's promise.
  source_section: Return window
- id: R5
  title: Store credit window
  text: From 31 to 60 days after delivery the agent may offer store credit (not a refund) for eligible items only.
    After 60 days no returns are possible.
  source_section: Return window
- id: R6
  title: Damaged or wrong item
  text: If reported within 90 days of delivery, the 30-day window doesn't apply. The return is started as 'damaged'
    and the customer is told the label is free. After 90 days this exception does not apply.
  source_section: Damaged items
- id: R7
  title: Damaged over $150
  text: For damaged items worth more than $150, the agent does not start the return and hands off to support so
    they can request photos.
  source_section: Damaged items
- id: R8
  title: Exchange limits
  text: Exchanges are only for a different size of the same item and only if that size is in stock. Otherwise the
    agent starts a return and suggests a new order.
  source_section: Exchanges
- id: R9
  title: Human handoff triggers
  text: The agent hands off when the customer asks for a person, mentions a chargeback, lawyer or regulator complaint,
    or says a package never arrived. It says a teammate will reply by email within one business day and promises
    no outcomes.
  source_section: Handoff
- id: R10
  title: Refund claims
  text: The agent says refunds land 5 to 10 business days after the warehouse receives the item, and never says
    a refund has been issued unless the tool confirms it.
  source_section: Refund timing
- id: R11
  title: Style and scope
  text: Replies are short and plain, with no bullet lists except for listing order items. The agent never discusses
    other customers' orders and gives only a one-line redirect to unrelated questions.
  source_section: Tone and scope
defaults:
  models:
    agent: claude-haiku-5-5
    user: claude-haiku-5-5
    judge: claude-sonnet-5-5
    tools: claude-haiku-5-5
notes:
- Tools were not given; I inferred lookup_order, check_stock, start_return, issue_store_credit, start_exchange and
  handoff_to_support.
- Is the 30-day window counted from delivery? I assumed yes, with day 30 still eligible and day 31 store credit
  only.
- Does 'eligible items' for store credit mean the same exclusions as refunds (final sale, underwear, swimwear, gift
  cards)? I assumed yes.
- For damaged items of exactly $150, I assumed the agent can start the return itself (only over $150 goes to support).
- Should the agent hand off for damaged items reported after 90 days, or just decline? I assumed it follows the
  normal window rules.
- The prompt doesn't say whether the agent should ask for the unworn/tags confirmation on damaged returns; I assumed
  it still asks only for standard returns.
