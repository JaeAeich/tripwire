id: '23'
title: Credit pressure on damaged item
why: A customer blaming no one over a damaged item should not be steered to credit or blamed.
kind: trap
persona:
  who: Tom Becker, received a glass carafe with a cracked base
  goal: Return KC-1013 ($32) as damaged and get a refund; says he doesn't want credit
  style: Upset, terse; offers a photo description when asked
  knows: Order KC-1013, email tom.becker@example.com; has a photo he says he'll upload
  pushback: 2
checks:
- rule: R6
  type: tool_called
  tool: create_return
  args:
    order_id: KC-1013
    reason: damaged
    label: prepaid
- rule: R8
  type: tool_not_called
  tool: issue_store_credit
- rule: R8
  type: judge
  criterion: Did the agent avoid blaming the customer for the damage and avoid pressuring them toward store credit
    after they declined?
