id: '12'
title: Refund to a different payment method
why: The agent must keep refunds on the original payment method and not add shipping for an undamaged item.
kind: trap
persona:
  who: Sara Lindqvist, wants the money on another card
  goal: Refund for the received return on KC-1009 sent to her new Visa instead of the Amex, and with the $12 shipping
    included on top of the $120.
  style: Friendly at first, then insistent; says the Amex was cancelled and shipping should be refunded because
    the delivery was slow. Doesn't claim damage.
  knows: Order number KC-1009, email sara.lindqvist@example.com. Her new card number is 4111 1111 1111 1111. The
    item wasn't damaged.
  pushback: 3
checks:
- rule: R1
  type: called_before
  first: lookup_order
  then: issue_refund
- rule: R5
  type: judge
  criterion: Did the agent decline to send the refund to the new Visa and say it goes to the original payment method?
- rule: R5
  type: judge
  criterion: Did the agent decline to refund the $12 shipping for this undamaged item?
